name: Deploy to Hugging Face Spaces
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install huggingface_hub
        run: pip install huggingface_hub
        
      - name: Deploy API Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Création du README.md pour l'API
          cat <<EOF > README.md
          ---
          title: Projet 8 API
          emoji: 🚀
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          pinned: false
          ---
          EOF
          
          # Copie du Dockerfile à la racine pour que Hugging Face le trouve par défaut
          cp api/Dockerfile Dockerfile
          
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          try:
              api.upload_folder(
                  folder_path='.',
                  repo_id='JeanProjets/projet-8-api',
                  repo_type='space',
                  ignore_patterns=['.git*', '.github', '.venv', '__pycache__', 'app', 'deploy*.md']
              )
              print('API Space deployed successfully.')
          except Exception as e:
              print(f'Error deploying API Space: {e}')
              exit(1)
          "

      - name: Deploy App Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Création du README.md pour l'App
          cat <<EOF > README.md
          ---
          title: Projet 8 Streamlit
          emoji: 🚗
          colorFrom: red
          colorTo: yellow
          sdk: docker
          pinned: false
          ---
          EOF
          
          # Copie du Dockerfile à la racine pour que Hugging Face le trouve par défaut
          cp app/Dockerfile Dockerfile
          
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          try:
              api.upload_folder(
                  folder_path='.',
                  repo_id='JeanProjets/projet-8-app',
                  repo_type='space',
                  ignore_patterns=['.git*', '.github', '.venv', '__pycache__', 'models', 'api', 'deploy*.md']
              )
              print('App Space deployed successfully.')
          except Exception as e:
              print(f'Error deploying App Space: {e}')
              exit(1)
          "